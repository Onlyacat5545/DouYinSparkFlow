name: Session regression tests
on:
  push:
    branches: [main, fix/detect-expired-session]
    paths:
      - 'core/**'
      - 'tests/**'
      - '.github/workflows/test-session.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'tests/**'
      - '.github/workflows/test-session.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install chromium --with-deps --only-shell
      - run: python -m unittest discover -s tests -v
